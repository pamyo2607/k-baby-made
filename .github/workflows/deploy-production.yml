name: Deploy verified K-Baby Made production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify_production_deployment.py"
      - ".github/workflows/deploy-production.yml"

permissions:
  contents: write

concurrency:
  group: k-baby-made-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://k-baby-made.pamyo26.workers.dev

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Require configured Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Rebuild and verify deployable assets
        run: npm run check

      - name: Deploy current verified assets to Cloudflare Workers
        run: npx wrangler deploy

      - name: Verify production byte-for-byte and write proof
        run: |
          python scripts/verify_production_deployment.py \
            --base-url "$PRODUCTION_URL" \
            --source-commit "$GITHUB_SHA"

      - name: Commit verified production proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "k-baby-made-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            data/codex-production-verification.json \
            data/strict-419-production-final-proof.json \
            data/strict-419-live-sync-proof.json \
            data/strict-419-app-activation-proof.json \
            data/strict-419-unique-meta-proof.json
          if git diff --cached --quiet; then
            echo "Production proof already matches"
            exit 0
          fi
          git commit -m "deploy: record verified production asset readback"
          git pull --rebase origin main
          git push origin main
