name: K-Baby Made strict product research

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "research-trigger.txt"

permissions:
  contents: write
  actions: read

concurrency:
  group: k-baby-made-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout cumulative database
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Recover cumulative database when needed
        run: python scripts/bootstrap_from_sheet.py

      - name: Revalidate 50 pending products and discover 20 candidates per category
        run: python scripts/research_runner.py --pending-limit 50 --new-per-category 20 --all-categories

      - name: Rebuild deployable assets
        run: python scripts/build_assets.py

      - name: Strict validation
        run: python scripts/validate_data.py

      - name: Commit verified cumulative changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "k-baby-made-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data public fallback-products.json kbaby-data.js meta.json health.json
          if git diff --cached --quiet; then
            echo "No verified changes"
            exit 0
          fi
          git commit -m "data: update strict product research results"
          git pull --rebase origin main
          git push
