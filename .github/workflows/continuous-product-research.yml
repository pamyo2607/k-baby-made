name: K-Baby Made ultra-strict product research

on:
  workflow_dispatch:
  schedule:
    # 매시 정각의 GitHub Actions 혼잡을 피한 시간당 1회 실행.
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "research-trigger.txt"

permissions:
  contents: write
  actions: read

concurrency:
  group: k-baby-made-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      KBABY_QUALITY_MODE: ultra
      KBABY_PENDING_LIMIT: "50"
      KBABY_NEW_CANDIDATE_LIMIT: "30"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout cumulative database
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Reconcile cumulative database
        run: python scripts/bootstrap_from_sheet.py

      - name: Revalidate up to 50 pending products and discover up to 30 exact candidates
        run: python scripts/run_ultra_naver.py

      - name: Sanitize irrelevant and duplicate candidates
        run: python scripts/sanitize_naver_candidates.py

      - name: Verify effective research progress
        run: python scripts/verify_research_effectiveness.py

      - name: Enforce per-run research limits and metric consistency
        run: python scripts/enforce_research_targets.py

      - name: Enforce ultra-quality inclusion gate
        run: python scripts/enforce_ultra_quality.py

      - name: Rebuild and run the complete repository check contract
        run: npm run check

      - name: Final ultra-quality verification
        run: python scripts/verify_ultra_quality.py

      - name: Commit safe cumulative research progress
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "k-baby-made-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data public fallback-products.json kbaby-data.js meta.json health.json
          if git diff --cached --quiet; then
            echo "No verified cumulative changes"
          else
            git commit -m "data: persist verified cumulative research progress"
            git push
          fi
