name: K-Baby Made ultra-strict product research

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions가 허용하는 최단 간격 5분.
    # 매시 정각 혼잡을 피하기 위해 2분부터 5분 간격으로 실행한다.
    - cron: "2-59/5 * * * *"
  push:
    branches: [main]
    paths:
      - "research-trigger.txt"

permissions:
  contents: write
  actions: read

concurrency:
  group: k-baby-made-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      KBABY_QUALITY_MODE: ultra
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout cumulative database
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Recover cumulative database when needed
        run: python scripts/bootstrap_from_sheet.py

      - name: Revalidate 50 pending products and discover 20 candidates per category
        run: >
          python scripts/run_ultra_parallel.py

      - name: Sanitize generic and duplicate candidates
        run: python scripts/sanitize_discovered_candidates.py

      - name: Verify effective research progress
        run: python scripts/verify_research_effectiveness.py

      - name: Enforce ultra-quality inclusion gate
        run: python scripts/enforce_ultra_quality.py

      - name: Rebuild deployable assets
        run: python scripts/build_assets.py

      - name: Existing strict validation
        run: python scripts/validate_data.py

      - name: Final ultra-quality verification
        run: python scripts/verify_ultra_quality.py

      - name: Commit verified cumulative changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "k-baby-made-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data public fallback-products.json kbaby-data.js meta.json health.json
          if git diff --cached --quiet; then
            echo "No verified changes"
            exit 0
          fi
          git commit -m "data: update ultra-strict product research results"
          git pull --rebase origin main
          git push
