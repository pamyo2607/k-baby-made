name: K-Baby Made search provider diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "search-diagnostics-trigger.txt"
      - "naver-resolution-trigger.txt"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/search_provider_diagnostics.py
      - run: python scripts/naver_resolution_diagnostics.py
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "k-baby-made-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/search-provider-diagnostics.json data/naver-resolution-diagnostics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: record search provider diagnostics"
          git pull --rebase origin main
          git push
